syntax = "proto3";

package UserService;
option go_package = "./UserService";


// 用户注册请求
message RegisterRequest {
  // 用户名
  string Username = 1;
  // 密码
  string Password = 2;
  // 电子邮件
  string Email = 3;
}

// 用户注册响应
message RegisterResponse {
  // 用户id
  uint64 UserId = 1;
}

// 获取用户信息请求
message GetUserInfoByIdRequest {
  // 用户ID
  uint64 UserId = 1;
}

// 获取用户信息（包含敏感信息）响应
message UserSensitiveInfoResponse {
  // 用户ID
  uint64 UserId = 1;
  // 用户名
  string Username = 2;
  // 个人介绍
  string Bio = 4;
  // 个人语录
  string Quotes = 7;
  // 心情ID
  uint64 MoodId = 8;
  // 电子邮件（敏感信息）
  string Email = 9;
}
// 获取用户信息（不包含敏感信息）响应
message UserNonSensitiveInfoResponse {
  // 用户ID
  uint64 UserId = 1;
  // 用户名
  string Username = 2;
  // 个人介绍
  string Bio = 4;
  // 个人语录
  string Quotes = 7;
  // 心情ID
  uint64 MoodId = 8;
}

// 更新用户信息请求
message UpdateUserRequest {
  // 用户ID
  uint64 UserId = 1;
  // 新用户名，可选
  string Username = 2;
  // 新个人介绍，可选
  string Bio = 3;
}

// 更新用户信息响应
message UpdateUserResponse {
  // 用户id
  uint64 UserId = 1;
}

// 修改密码请求
message ChangePasswordRequest {
  // 用户ID
  uint64 UserId = 1;
  // 新密码
  string NewPassword = 3;
}

// 修改密码响应
message ChangePasswordResponse {
  // 用户ID
  uint64 UserId = 1;
}

// 删除用户请求
message DeleteUserRequest {
  // 用户ID
  uint64 UserId = 1;
}

// 删除用户响应
message DeleteUserResponse {
  // 用户ID
  uint64 UserId = 1;
}

// 验证密码请求
message AuthenticateRequest {
  // 电子邮件
  string Email = 1;
  // 密码
  string Password = 2;
}
// 验证密码响应
message AuthenticateResponse {
  // 用户ID
  uint64 UserId = 1;
}



// 关注请求
message FollowRequest {
  // 关注者ID
  uint64 FollowerId = 1;
  // 被关注者ID
  uint64 FollowingId = 2;
}

// 关注响应
message FollowResponse {
  // 被关注者ID
  uint64 FollowingId = 1;
}

// 取消关注请求
message UnfollowRequest {
  // 关注者ID
  uint64 FollowerId = 1;
  // 被取消关注者ID
  uint64 FollowingId = 2;
}

// 取消关注响应
message UnfollowResponse {
  // 被取消关注者ID
  uint64 FollowingId = 1;
}

// 获取关注列表请求
message GetFollowingListRequest {
  // 用户ID
  uint64 UserId = 1;
}

// 获取关注列表响应
message GetFollowingListResponse {
  // 关注列表
  repeated uint64 UserIds = 1;
}

// 获取被关注列表请求
message GetFollowersListRequest {
  // 用户ID
  uint64 UserId = 1;
}

// 获取被关注列表响应
message GetFollowersListResponse {
  // 被关注列表
  repeated uint64 UserIds = 1;
}
service User {
  //  注册新用户
  rpc Register (RegisterRequest) returns (RegisterResponse);
  //  验证用户密码（用途包括不限于“登录”，修改密码前的验证，修改信息前的验证等）
  rpc Authenticate (AuthenticateRequest) returns (AuthenticateResponse);
  //  获取用户信息（包含敏感信息）
  rpc GetUserSensitive (GetUserInfoByIdRequest) returns (UserSensitiveInfoResponse);
  //  获取用户信息（不包含敏感信息）
  rpc GetUserNonSensitive (GetUserInfoByIdRequest) returns (UserNonSensitiveInfoResponse);
  //  更新用户信息
  rpc UpdateUser (UpdateUserRequest) returns (UpdateUserResponse);
  //  修改密码
  rpc ChangePassword (ChangePasswordRequest) returns (ChangePasswordResponse);
  //  删除用户
  rpc DeleteUser (DeleteUserRequest) returns (DeleteUserResponse);
  //  关注用户
  rpc Follow (FollowRequest) returns (FollowResponse);
  //  取消关注用户
  rpc Unfollow (UnfollowRequest) returns (UnfollowResponse);
  //  获取关注列表
  rpc GetFollowingList (GetFollowingListRequest) returns (GetFollowingListResponse);
  //  获取被关注列表
  rpc GetFollowersList (GetFollowersListRequest) returns (GetFollowersListResponse);
}


message GetRoleRequest {
  // 角色ID
  uint64 RoleId = 1;
}
message GetRoleResponse {
  // 角色ID
  uint64 RoleId = 1;
  // 角色名称
  string RoleName = 2;
}
message GetRoleListRequest {}
message GetRoleListResponse {
  // 角色列表
  repeated GetRoleResponse Roles = 1;
}
message UpdateRoleRequest {
  // 角色ID
  uint64 RoleId = 1;
  // 新角色名称
  string NewRoleName = 2;
}
message UpdateRoleResponse {
  // 角色ID
  uint64 RoleId = 1;
}
message DeleteRoleRequest {
  // 角色ID
  uint64 RoleId = 1;
}
message DeleteRoleResponse {
  // 角色ID
  uint64 RoleId = 1;
}
message CreateRoleRequest {
  // 角色名称
  string RoleName = 1;
  // 说明
  string Description = 2;
}
message CreateRoleResponse {
  // 角色ID
  uint64 RoleId = 1;
  // 角色名称
  string RoleName = 2;
}


message GetUserRolesRequest {
  // 用户ID
  uint64 UserId = 1;
}
message GetUserRolesResponse {
  // 角色列表
  repeated GetRoleResponse Roles = 1;
}
message AddUserRoleRequest {
  // 用户ID
  uint64 UserId = 1;
  // 角色ID
  uint64 RoleId = 2;
}
message AddUserRoleResponse {
  // 用户ID
  uint64 UserId = 1;
  // 角色ID
  uint64 RoleId = 2;
}
message DeleteUserRoleRequest {
  // 用户ID
  uint64 UserId = 1;
  // 角色ID
  uint64 RoleId = 2;
}
message DeleteUserRoleResponse {
  // 用户ID
  uint64 UserId = 1;
  // 角色ID
  uint64 RoleId = 2;
}
message GetRoleUsersRequest {
  // 角色ID
  uint64 RoleId = 1;
}
message GetRoleUsersResponse {
  // 用户列表
  repeated UserNonSensitiveInfoResponse Users = 1;
}
message CheckUserRoleRequest {
  // 用户ID
  uint64 UserId = 1;
  // 角色ID
  uint64 RoleId = 2;
}
message CheckUserRoleResponse {
  // 用户ID
  uint64 UserId = 1;
  // 角色ID
  uint64 RoleId = 2;
  // 是否拥有该角色
  bool HasRole = 3;
}


service Role {
  //  获取角色信息
  rpc GetRole (GetRoleRequest) returns (GetRoleResponse);
  //  获取角色列表
  rpc GetRoleList (GetRoleListRequest)   returns (GetRoleListResponse);
  //  更新角色
  rpc UpdateRole (UpdateRoleRequest) returns (UpdateRoleResponse);
  //  删除角色
  rpc DeleteRole (DeleteRoleRequest) returns (DeleteRoleResponse);
  //  创建角色
  rpc CreateRole (CreateRoleRequest) returns (CreateRoleResponse);
  //  获取用户角色列表
  rpc GetUserRoles (GetUserRolesRequest) returns (GetUserRolesResponse);
  //  添加用户角色
  rpc AddUserRole (AddUserRoleRequest) returns (AddUserRoleResponse);
  //  删除用户角色
  rpc DeleteUserRole (DeleteUserRoleRequest) returns (DeleteUserRoleResponse);
  //  获取角色用户列表
  rpc GetRoleUsers (GetRoleUsersRequest) returns (GetRoleUsersResponse);
  //  检查用户角色
  rpc CheckUserRole (CheckUserRoleRequest) returns (CheckUserRoleResponse);
}

// 权限请求
message GetPermissionRequest {
  //  权限ID
  uint64 Id = 1;
}
message GetPermissionResponse {
  //  权限ID
  uint64 Id = 1;
  //  权限名称
  string Name = 2;
  //  请求方法
  string Method = 3;
  //  权限描述
  string Description = 4;
}
message CreatePermissionRequest {
  //  权限名称
  string Name = 1;
  //  请求方法
  string Method = 2;
  //  权限描述
  string Description = 3;
}
message CreatePermissionResponse {
  //  权限ID
  uint64 Id = 1;
}
message DeletePermissionRequest {
  //  权限ID
  uint64 Id = 1;
}
message DeletePermissionResponse {
  //  权限ID
  uint64 Id = 1;
}

// 角色权限请求
message AssignRolePermissionRequest {
  uint64 RoleId = 1;
  uint64 PermissionId = 2;
}
message AssignRolePermissionResponse {
  uint64 RoleId = 1;
  uint64 PermissionId = 2;
}
message RemoveRolePermissionRequest {
  uint64 RoleId = 1;
  uint64 PermissionId = 2;
}
message RemoveRolePermissionResponse {
  uint64 RoleId = 1;
  uint64 PermissionId = 2;
}
message GetRolePermissionsRequest {
  uint64 RoleId = 1;
}
message GetRolePermissionsResponse {
  repeated GetPermissionResponse Permissions = 1;
}
message GetUserPermissionsRequest {
  uint64 UserId = 1;
}
message GetUserPermissionsResponse {
  repeated GetPermissionResponse Permissions = 1;
}
service Permission {
  //  获取权限信息
  rpc GetPermission (GetPermissionRequest) returns (GetPermissionResponse);
  //  创建权限
  rpc CreatePermission (CreatePermissionRequest) returns (CreatePermissionResponse);
  //  删除权限
  rpc DeletePermission (DeletePermissionRequest) returns (DeletePermissionResponse);
  //  角色权限
  rpc AssignRolePermission (AssignRolePermissionRequest) returns (AssignRolePermissionResponse);
  //  移除角色权限
  rpc RemoveRolePermission (RemoveRolePermissionRequest) returns (RemoveRolePermissionResponse);
  //  获取角色权限
  rpc GetRolePermissions (GetRolePermissionsRequest) returns (GetRolePermissionsResponse);
  //  获取用户权限
  rpc GetUserPermissions (GetUserPermissionsRequest) returns (GetUserPermissionsResponse);
}